<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prowestor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Prowestor</h1>
</header>

<section class="hero">
  <h2>Welcome to Prowestor</h2>
  <p>Digital service platform for user credits</p>
</section>

<section class="user-form">
  <h3>User Information</h3>
  <input type="text" id="userId" placeholder="Enter User ID">
  <input type="text" id="userName" placeholder="Enter Name">
  <button onclick="showPlans()">Continue</button>
</section>

<section id="plans" class="hidden" style="display:none;">
  <h3>Select Plan</h3>

  <div class="plan">
    <h4>Red Credits</h4>
    <button onclick="pay(199, '1800 Red')">₹199 - 1800</button>
    <button onclick="pay(249, '3000 Red')">₹249 - 3000</button>
    <button onclick="pay(599, '10K Red')">₹599 - 10K</button>
  </div>

  <div class="plan">
    <h4>Gold Credits</h4>
    <button onclick="pay(199, '1800 Gold')">₹199 - 1800</button>
  </div>
</section>

<footer>
  <a href="terms.html">Terms</a> | 
  <a href="privacy.html">Privacy</a> | 
  <a href="refund.html">Refund</a> | 
  <a href="contact.html">Contact</a>
</footer>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="script.js"></script>

</body>
</html>
