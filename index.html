<!DOCTYPE html>
<html>
<head>
<title>Prowestor</title>

<style>
body {
  font-family: Arial;
  background: #0b1e2d;
  color: white;
  text-align: center;
}

.container {
  max-width: 400px;
  margin: auto;
  margin-top: 40px;
}

.card {
  background: #132f46;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.pack {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 12px 0;
}

button {
  padding: 8px 15px;
  border: none;
  background: #00b894;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #019874;
}

h3 {
  margin-bottom: 10px;
}
</style>

</head>

<body>

<div class="container">

  <!-- RED PACKET -->
  <div class="card">
    <h3>Red Packet</h3>

    <div class="pack"><span>1800 Red Packet</span><button>₹199</button></div>
    <div class="pack"><span>3000 Red Packet</span><button>₹249</button></div>
    <div class="pack"><span>10,000 Red Packet</span><button>₹599</button></div>
    <div class="pack"><span>50,000 Red Packet</span><button>₹2599</button></div>
    <div class="pack"><span>100,000 Red Packet</span><button>₹4599</button></div>

  </div>

  <!-- WE PLAY COIN -->
  <div class="card">
    <h3>We Play Coin</h3>

    <div class="pack"><span>1800 Coin</span><button>₹199</button></div>
    <div class="pack"><span>3000 Coin</span><button>₹249</button></div>
    <div class="pack"><span>10,000 Coin</span><button>₹599</button></div>
    <div class="pack"><span>50,000 Coin</span><button>₹2599</button></div>
    <div class="pack"><span>100,000 Coin</span><button>₹4599</button></div>

  </div>

</div>

</body>
</html>
