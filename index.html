<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prowestor</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #061c2d;
  color: white;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: black;
  color: #00e6b8;
  font-size: 20px;
}

/* BANNER */
.banner {
  text-align: center;
  padding: 15px;
}

.banner img {
  width: 90%;
  border-radius: 12px;
}

/* CARD */
.card {
  background: #132f46;
  margin: 15px;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
}

input {
  width: 90%;
  padding: 12px;
  margin: 10px;
  border-radius: 6px;
  border: none;
}

button {
  padding: 10px 20px;
  background: #00b894;
  border: none;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

.pack {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
}

.hidden {
  display: none;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
  <div>☰</div>
  <div>Prowestor</div>
  <div>🔍</div>
</div>

<!-- BANNER -->
<div class="banner">
  <img src="https://i.imgur.com/8Km9tLL.png">
</div>

<!-- USER INFO -->
<div id="loginBox" class="card">
  <h3>User Information</h3>
  <input type="text" id="userId" placeholder="Enter Prowestor ID">
  <input type="text" id="name" placeholder="Enter Name">
  <br>
  <button onclick="continueStep()">Continue</button>
</div>

<!-- CONFIRM -->
<div id="confirmBox" class="card hidden">
  <h3>Confirm</h3>
  <p id="showData"></p>
  <button onclick="showOptions()">Confirm</button>
</div>

<!-- PACKAGES -->
<div id="options" class="hidden">

  <div class="card">
    <h3>Red Packet</h3>
    <div class="pack"><span>1800</span><button onclick="pay(199,'1800 Red')">₹199</button></div>
    <div class="pack"><span>3000</span><button onclick="pay(249,'3000 Red')">₹249</button></div>
    <div class="pack"><span>10K</span><button onclick="pay(599,'10K Red')">₹599</button></div>
    <div class="pack"><span>50K</span><button onclick="pay(2599,'50K Red')">₹2599</button></div>
    <div class="pack"><span>100K</span><button onclick="pay(4599,'100K Red')">₹4599</button></div>
  </div>

  <div class="card">
    <h3>We Play Coin</h3>
    <div class="pack"><span>1800</span><button onclick="pay(199,'1800 Coin')">₹199</button></div>
    <div class="pack"><span>3000</span><button onclick="pay(249,'3000 Coin')">₹249</button></div>
    <div class="pack"><span>10K</span><button onclick="pay(599,'10K Coin')">₹599</button></div>
    <div class="pack"><span>50K</span><button onclick="pay(2599,'50K Coin')">₹2599</button></div>
    <div class="pack"><span>100K</span><button onclick="pay(4599,'100K Coin')">₹4599</button></div>
  </div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

let userIdGlobal = "";
let nameGlobal = "";

/* STEP 1 */
function continueStep() {
  let id = document.getElementById("userId").value;
  let name = document.getElementById("name").value;

  if(id=="" || name==""){
    alert("Fill all details");
    return;
  }

  userIdGlobal = id;
  nameGlobal = name;

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("confirmBox").classList.remove("hidden");

  document.getElementById("showData").innerHTML =
    "ID: "+id+"<br>Name: "+name;
}

/* STEP 2 */
function showOptions() {
  document.getElementById("confirmBox").style.display = "none";
  document.getElementById("options").classList.remove("hidden");
}

/* PAYMENT */
function pay(amount, plan) {

  var options = {
    "key": "YOUR_KEY_HERE",
    "amount": amount * 100,
    "currency": "INR",
    "name": "Prowestor",
    "description": plan,

    "handler": function (response){

      alert("Payment Success!");

      /* 🔴 Yaha backend call karna padega */
      console.log({
        userId: userIdGlobal,
        name: nameGlobal,
        plan: plan,
        payment: response.razorpay_payment_id
      });
    }
  };

  var rzp = new Razorpay(options);
  rzp.open();
}
</script>

</body>
</html>
